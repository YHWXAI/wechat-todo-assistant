plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wechattodo.assistant'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.wechattodo.assistant'
        minSdk 33
        targetSdk 35
        versionCode 18
        versionName '0.2.16'
        buildConfigField 'String', 'UPDATE_REPOSITORY', '"YHWXAI/wechat-todo-assistant"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
