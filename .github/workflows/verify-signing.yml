name: Verify hosted Android signing key
run-name: Verify signing ${{ inputs.verification_id }}
on:
  workflow_dispatch:
    inputs:
      verification_id:
        description: Identifier used to locate this verification run
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: updates
          path: channel
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install signing tools
        run: bash source/scripts/setup-android.sh 'build-tools;35.0.0'
      - name: Verify encrypted key by signing an APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 source/scripts/prepare-update.py channel/WeChatTodo-debug.apk channel --verify-key
      - name: Record result
        run: echo 'Hosted signing key matches the original app; no update was published.' >> "$GITHUB_STEP_SUMMARY"
