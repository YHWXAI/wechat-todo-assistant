name: Publish signed Android update

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-update-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: source
          persist-credentials: false
      - name: Check out update channel
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: updates
          path: channel
      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: bash source/scripts/setup-android.sh 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Build and lint
        working-directory: source
        run: bash gradlew --no-daemon --max-workers=4 :app:assembleDebug :app:lintDebug
      - name: Sign with original key and prepare update
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 source/scripts/prepare-update.py source/app/build/outputs/apk/debug/app-debug.apk channel
      - name: Publish APK and manifest together
        working-directory: channel
        run: |
          tag=$(python3 -c 'import json; print(json.load(open("updates.json"))["version"])')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates.json WeChatTodo-debug.apk "$tag/WeChatTodo-debug.apk"
          if ! git diff --cached --quiet; then
            git commit -m "Publish signed $tag update"
            git push origin HEAD:updates
          fi
          echo "Published $tag" >> "$GITHUB_STEP_SUMMARY"
